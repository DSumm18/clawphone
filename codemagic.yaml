workflows:
  ios-workflow:
    name: ClawPhone iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      xcode: latest
      cocoapods: default
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.dsumm.clawphone"
        XCODE_PROJECT: "ClawPhone.xcodeproj"
        XCODE_SCHEME: "ClawPhone"
    
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
        
      - name: Generate Xcode project
        script: xcodegen generate
        
      - name: Set up keychain
        script: keychain initialize
        
      - name: Decode private key
        script: |
          mkdir -p "$HOME/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | base64 --decode > "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          cat "$HOME/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_IDENTIFIER.p8"
          
      - name: Fetch signing certificates
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_DEVELOPMENT \
            --create
          
      - name: Set up signing
        script: |
          keychain add-certificates
          xcode-project use-profiles
          
      - name: Build iOS app
        script: |
          xcodebuild build \
            -project ClawPhone.xcodeproj \
            -scheme ClawPhone \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
