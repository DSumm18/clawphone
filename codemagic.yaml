workflows:
  ios-workflow:
    name: ClawPhone iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.dsumm.clawphone"
        XCODE_PROJECT: "ClawPhone.xcodeproj"
        XCODE_SCHEME: "ClawPhone"
      ios_signing:
        distribution_type: development
        bundle_identifier: com.dsumm.clawphone
    
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
        
      - name: Generate Xcode project
        script: xcodegen generate
        
      - name: Build iOS app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/ios/xcarchive/*.xcarchive
