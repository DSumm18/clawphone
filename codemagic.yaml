workflows:
  ios-workflow:
    name: ClawPhone iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.dsumm.clawphone"
        XCODE_PROJECT: "ClawPhone.xcodeproj"
        XCODE_SCHEME: "ClawPhone"
    
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
        
      - name: Generate Xcode project
        script: xcodegen generate
        
      - name: List schemes
        script: xcodebuild -project ClawPhone.xcodeproj -list
        
      - name: Build iOS app (Simulator - No Signing)
        script: |
          xcodebuild build \
            -project ClawPhone.xcodeproj \
            -scheme ClawPhone \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
