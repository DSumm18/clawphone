workflows:
  ios-workflow:
    name: ClawPhone iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.dsumm.clawphone"
        XCODE_PROJECT: "ClawPhone.xcodeproj"
        XCODE_SCHEME: "ClawPhone"
    
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
        
      - name: Generate Xcode project
        script: xcodegen generate
        
      - name: Build iOS app (Simulator - No Signing)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=17.2' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES
    
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - ~/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
