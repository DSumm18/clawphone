name: ClawPhone
options:
  bundleIdPrefix: com.dsumm
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"

settings:
  base:
    DEVELOPMENT_TEAM: J7W6QJ77XW
    MARKETING_VERSION: "5.5.0"
    CURRENT_PROJECT_VERSION: "55"

targets:
  ClawPhone:
    type: application
    platform: iOS
    sources:
      - ClawPhone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsumm.clawphone
        INFOPLIST_FILE: ClawPhone/Info.plist
        CODE_SIGN_STYLE: Automatic
    info:
      path: ClawPhone/Info.plist
      properties:
        CFBundleDisplayName: ClawPhone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSpeechRecognitionUsageDescription: ClawPhone needs speech recognition to convert your voice to messages.
        NSMicrophoneUsageDescription: ClawPhone needs microphone access to hear your voice messages.
        NSCameraUsageDescription: ClawPhone needs camera access to take photos to send to your AI.
        NSPhotoLibraryUsageDescription: ClawPhone needs photo library access to share images with your AI.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            142.132.160.28:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    dependencies:
      - target: ClawPhoneWatch
        embed: true

  ClawPhoneWatch:
    type: application
    platform: watchOS
    sources:
      - ClawPhoneWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dsumm.clawphone.watchkitapp
        INFOPLIST_FILE: ClawPhoneWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.dsumm.clawphone
    info:
      path: ClawPhoneWatch/Info.plist
      properties:
        CFBundleDisplayName: ClawPhone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dsumm.clawphone
        NSSpeechRecognitionUsageDescription: ClawPhone needs speech recognition.
        NSMicrophoneUsageDescription: ClawPhone needs microphone access.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            142.132.160.28:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true

schemes:
  ClawPhone:
    build:
      targets:
        ClawPhone: all
        ClawPhoneWatch: all
